name: Deploy Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  DEPLOY_PATH: /var/sites/project-management

jobs:
  build:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
      image_name: ${{ steps.image_name.outputs.name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute lowercase image name
        id: image_name
        run: echo "name=$(echo '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image_name.outputs.name }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/prod/Dockerfile
          target: slim
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to production
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_PORT: ${{ secrets.STAGING_SSH_PORT }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          STAGING_SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          for var in STAGING_HOST STAGING_USER STAGING_PORT STAGING_SSH_PRIVATE_KEY; do
            if [ -z "${!var}" ]; then
              echo "::error::${var} secret is required."
              exit 1
            fi
          done

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$STAGING_SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$STAGING_PORT" "$STAGING_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          # Create SSH config for simpler commands
          cat >> ~/.ssh/config <<EOF
          Host deploy-target
            HostName ${STAGING_HOST}
            User ${STAGING_USER}
            Port ${STAGING_PORT}
            IdentityFile ~/.ssh/deploy_key
            StrictHostKeyChecking no
            ServerAliveInterval 15
            ServerAliveCountMax 10
          EOF
          chmod 600 ~/.ssh/config

      - name: Create GHCR token for server
        id: ghcr_token
        run: |
          echo '${{ secrets.GITHUB_TOKEN }}' > /tmp/ghcr_token

      - name: Upload compose files and deploy
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_DATABASE: ${{ secrets.DB_DATABASE }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          SMTP_ADDRESS: ${{ secrets.SMTP_ADDRESS }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_DOMAIN: ${{ secrets.SMTP_DOMAIN }}
          SMTP_USER_NAME: ${{ secrets.SMTP_USER_NAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
          FULL_IMAGE_NAME: ${{ needs.build.outputs.image_name }}
        run: |
          set -euo pipefail

          # Create deploy directory
          ssh deploy-target "mkdir -p '${DEPLOY_PATH}'"

          # Upload docker-compose file
          scp docker-compose.prod.yml "deploy-target:${DEPLOY_PATH}/docker-compose.yml"

          # Generate .env on the server
          cat > /tmp/deploy.env <<ENVFILE
          COMPOSE_PROJECT_NAME=openproject
          COMPOSE_PROJECT_IMAGE=${FULL_IMAGE_NAME}
          IMAGE_TAG=${IMAGE_TAG}

          DB_HOST=${DB_HOST}
          DB_DATABASE=${DB_DATABASE}
          DB_USERNAME=${DB_USERNAME}
          DB_PASSWORD=${DB_PASSWORD}

          SMTP_ADDRESS=${SMTP_ADDRESS}
          SMTP_PORT=${SMTP_PORT}
          SMTP_DOMAIN=${SMTP_DOMAIN}
          SMTP_USER_NAME=${SMTP_USER_NAME}
          SMTP_PASSWORD=${SMTP_PASSWORD}

          SECRET_KEY_BASE=$(openssl rand -hex 64)
          APP_PORT=8080
          ENVFILE

          scp /tmp/deploy.env "deploy-target:${DEPLOY_PATH}/.env"
          rm /tmp/deploy.env

          # Upload GHCR token
          scp /tmp/ghcr_token "deploy-target:/tmp/ghcr_token"

      - name: Login to GHCR on server
        env:
          GH_ACTOR: ${{ github.actor }}
        run: |
          ssh deploy-target "cat /tmp/ghcr_token | docker login ghcr.io -u '${GH_ACTOR}' --password-stdin && rm -f /tmp/ghcr_token"

      - name: Pull new images
        run: |
          ssh deploy-target "cd ${DEPLOY_PATH} && docker compose pull"

      - name: Restart containers
        run: |
          ssh deploy-target "cd ${DEPLOY_PATH} && docker compose up -d --remove-orphans && docker image prune -f"

      - name: Run database migrations
        run: |
          set -euo pipefail

          ssh deploy-target "
            cd ${DEPLOY_PATH}
            docker compose exec -T web bundle exec rails db:migrate RAILS_ENV=production
          "

      - name: Verify health
        run: |
          set -euo pipefail

          ssh deploy-target "
            set -euo pipefail
            for attempt in \$(seq 1 20); do
              if curl --fail --silent --show-error --max-time 5 http://127.0.0.1:8080/health; then
                echo
                echo 'Health check passed.'
                exit 0
              fi
              echo \"Waiting for app to start (attempt \$attempt/20)...\"
              sleep 10
            done

            echo 'Health check failed.'
            cd ${DEPLOY_PATH}
            docker compose logs --tail=100
            exit 1
          "
