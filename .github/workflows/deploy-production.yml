name: Deploy Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

env:
  DEPLOY_PATH: /var/sites/project-management

jobs:
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create production .env
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_DATABASE: ${{ secrets.DB_DATABASE }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          SMTP_ADDRESS: ${{ secrets.SMTP_ADDRESS }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_DOMAIN: ${{ secrets.SMTP_DOMAIN }}
          SMTP_USER_NAME: ${{ secrets.SMTP_USER_NAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: |
          set -euo pipefail

          cat > .env <<ENVFILE
          RAILS_ENV=production
          DATABASE_URL=postgres://${DB_USERNAME}:${DB_PASSWORD}@${DB_HOST}:5432/${DB_DATABASE}

          DB_HOST=${DB_HOST}
          DB_PORT=5432
          DB_USERNAME=${DB_USERNAME}
          DB_PASSWORD=${DB_PASSWORD}
          DB_DATABASE=${DB_DATABASE}

          SMTP_ADDRESS=${SMTP_ADDRESS}
          SMTP_PORT=${SMTP_PORT}
          SMTP_DOMAIN=${SMTP_DOMAIN}
          SMTP_USER_NAME=${SMTP_USER_NAME}
          SMTP_PASSWORD=${SMTP_PASSWORD}

          SECRET_KEY_BASE=$(openssl rand -hex 64)
          ENVFILE

          sed -i 's/^          //' .env

      - name: Create database config
        run: |
          cat > config/database.yml <<'DByml'
          production:
            adapter: postgresql
            encoding: unicode
            pool: 20
            host: <%= ENV.fetch("DB_HOST", "localhost") %>
            port: <%= ENV.fetch("DB_PORT", 5432) %>
            database: <%= ENV.fetch("DB_DATABASE", "openproject") %>
            username: <%= ENV.fetch("DB_USERNAME", "openproject") %>
            password: <%= ENV.fetch("DB_PASSWORD", "") %>
          DByml
          sed -i 's/^          //' config/database.yml

      - name: Configure SSH
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_PORT: ${{ secrets.STAGING_SSH_PORT }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          STAGING_SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          if [ -z "$STAGING_HOST" ]; then
            echo "::error::STAGING_HOST secret is required."
            exit 1
          fi

          if [ -z "$STAGING_USER" ]; then
            echo "::error::STAGING_USER secret is required."
            exit 1
          fi

          if [ -z "$STAGING_PORT" ]; then
            echo "::error::STAGING_SSH_PORT organization secret is required."
            exit 1
          fi

          if [ -z "$STAGING_SSH_PRIVATE_KEY" ]; then
            echo "::error::STAGING_SSH_PRIVATE_KEY organization secret is required."
            exit 1
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$STAGING_SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$STAGING_PORT" "$STAGING_HOST" >> ~/.ssh/known_hosts

      - name: Upload release
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          STAGING_PORT: ${{ secrets.STAGING_SSH_PORT }}
        run: |
          set -euo pipefail

          SSH_TARGET="${STAGING_USER}@${STAGING_HOST}"
          SSH_OPTS="-i ~/.ssh/deploy_key -p ${STAGING_PORT}"

          ssh ${SSH_OPTS} "$SSH_TARGET" "mkdir -p '${DEPLOY_PATH}'"

          rsync -az --delete \
            --exclude 'log/' \
            --exclude 'tmp/' \
            --exclude 'storage/' \
            --exclude '.git/' \
            --exclude 'node_modules/' \
            -e "ssh ${SSH_OPTS}" \
            ./ "${SSH_TARGET}:${DEPLOY_PATH}/"

      - name: Post-deploy setup
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          STAGING_PORT: ${{ secrets.STAGING_SSH_PORT }}
        run: |
          set -euo pipefail

          ssh -i ~/.ssh/deploy_key -p "$STAGING_PORT" \
            "${STAGING_USER}@${STAGING_HOST}" \
            "cd ${DEPLOY_PATH} && \
             bundle install --without development test && \
             cd frontend && npm ci && cd .. && \
             bundle exec rails db:migrate RAILS_ENV=production && \
             bundle exec rails assets:precompile RAILS_ENV=production && \
             sudo /bin/systemctl restart openproject && \
             sudo /bin/systemctl status openproject --no-pager"

      - name: Verify health
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          STAGING_PORT: ${{ secrets.STAGING_SSH_PORT }}
        run: |
          set -euo pipefail

          ssh -i ~/.ssh/deploy_key -p "$STAGING_PORT" \
            "${STAGING_USER}@${STAGING_HOST}" \
            "set -euo pipefail
             for attempt in \$(seq 1 12); do
               if curl --fail --silent --show-error --max-time 5 http://127.0.0.1:3000/health; then
                 echo
                 echo 'Health check passed.'
                 exit 0
               fi
               sleep 5
             done

             echo 'Health check failed.'
             sudo /bin/systemctl status openproject --no-pager || true
             sudo /usr/bin/journalctl -u openproject -n 120 --no-pager || true
             exit 1"
